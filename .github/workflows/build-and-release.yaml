name: Binary & Container Release

permissions:
  id-token: write
  contents: write
  packages: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1: Checkout code (required before using the action)
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Fetch all the history for GitVersion
          persist-credentials: true

      # TODO: add lint / test / scanning steps here

      # 2: Call our custom `GitVersion action` to tag the repo
      - name: Tag with GitVersion
        id: gitversion
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          configFilePath: gitversion.yml

      # 3: Use the custom build-release action
      - name: Build and Release Go Binary
        uses: michielvha/goreleaser-action@a86fcdf453812a9d69b85208c0cb6a1e73f136b8 # v1
        with:
          github-token: ${{ github.token }}
          pgp-private-key: ${{ secrets.PGP_PRIVATE_KEY }}

      # 4: Build and Push Docker image
      - name: Build and Push Docker Image
        uses: michielvha/docker-release-action@c499e52a1a05e5bdd8cf03ba19a423d4c7ec25e3 # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          project: ${{ github.event.repository.name }}
          version: ${{ steps.gitversion.outputs.semVer }}
          platforms: 'linux/amd64,linux/arm64'
          context: '.'
